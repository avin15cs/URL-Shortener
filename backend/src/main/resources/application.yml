# ============================================================
# Application Configuration
# ============================================================
spring:
  application:
    name: url-shortener

  # ---- DataSource (H2 in-memory for development) ----
  datasource:
    url: jdbc:h2:mem:urlshortenerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ---- JPA / Hibernate ----
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ---- H2 Console (development only) ----
  h2:
    console:
      enabled: true
      path: /h2-console

# ---- Server ----
server:
  port: 8080

# ---- Application Custom Properties ----
app:
  base-url: http://localhost:8080

# ---- Logging ----
logging:
  level:
    com.urlshortener: DEBUG
    org.springframework.web: INFO
