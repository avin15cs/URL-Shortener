# ============================================================
# Production Configuration (PostgreSQL)
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

# ---- Application Production Overrides ----
app:
  base-url: ${APP_BASE_URL:https://yourdomain.com}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:https://yourdomain.com}

# ---- Actuator (Production Lockdown: Health Only) ----
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ---- SpringDoc (Disable in Production) ----
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.urlshortener: INFO
