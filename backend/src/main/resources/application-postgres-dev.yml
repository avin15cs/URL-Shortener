# ============================================================
# PostgreSQL Development Configuration (Docker Compose)
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    open-in-view: false
    hibernate:
      # Development only: evolve the disposable local schema from JPA mappings.
      # Persistent/shared environments must use Liquibase plus ddl-auto=validate.
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: false
