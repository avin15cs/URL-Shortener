# ============================================================
# PostgreSQL Development Configuration (Docker Compose)
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:urlshortener}
    password: ${DB_PASSWORD:local-urlshortener-password}

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

  h2:
    console:
      enabled: false
