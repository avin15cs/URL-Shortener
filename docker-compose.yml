services:
  # ---- PostgreSQL Database ----
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: url-shortener-postgres:15.19-alpine3.24
    container_name: urlshortener-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      # Keep the development database reachable from local IDEs without exposing it
      # on every host network interface.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Spring Boot Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urlshortener-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres-dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: urlshortener
      DB_USER: postgres
      DB_PASSWORD: password
      APP_BASE_URL: http://localhost:8080
      FRONTEND_URL: http://localhost
      AUTH_ISSUER: http://localhost:9000
      AUTH_AUTHORIZATION_URI: http://localhost:9000/oauth2/authorize
      AUTH_TOKEN_URI: http://host.docker.internal:9000/oauth2/token
      AUTH_JWK_SET_URI: http://host.docker.internal:9000/oauth2/jwks
      AUTH_USER_INFO_URI: http://host.docker.internal:9000/userinfo
      AUTH_AUDIENCE: url-shortener-api
      URL_SHORTENER_CLIENT_ID: url-shortener
      URL_SHORTENER_CLIENT_SECRET: ${URL_SHORTENER_CLIENT_SECRET:-local-development-only}
      URL_SHORTENER_REDIRECT_URI: http://localhost:8080/login/oauth2/code/auth-server
      COOKIE_SECURE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- React Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urlshortener-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
