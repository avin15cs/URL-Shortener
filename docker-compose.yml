name: avinash-local

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:15.19-alpine3.24
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local-postgres-data:/var/lib/postgresql/data
    networks:
      - local-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  urlshortener-database-init:
    image: postgres:15.19-alpine3.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    volumes:
      - ./postgres/init-urlshortener.sql:/scripts/init-urlshortener.sql:ro
    networks:
      - local-database
    command:
      - psql
      - --host=postgres
      - --username=postgres
      - --dbname=postgres
      - --set=ON_ERROR_STOP=1
      - --file=/scripts/init-urlshortener.sql

  # ---- Spring Boot Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urlshortener-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      urlshortener-database-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: postgres-dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: urlshortener
      DB_USER: urlshortener
      DB_PASSWORD: local-urlshortener-password
      APP_BASE_URL: http://localhost:8080
    networks:
      - default
      - local-database
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- React Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urlshortener-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  local-postgres-data:
    name: url-shortener_postgres_data
    external: true

networks:
  local-database:
    name: avinash-local-database
